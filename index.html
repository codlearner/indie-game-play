<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="试玩">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hang 的游戏试玩</title>
<style>
:root {
  --bg: #15171c;
  --card: #22252d;
  --card-hover: #2b2f39;
  --text: #f1f2f4;
  --muted: #9aa0ab;
  --accent: #6aa8ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
    max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
main { max-width: 960px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 600; margin: 4px 0 4px; }
p.lead { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
a.game {
  display: block; text-decoration: none; color: inherit; background: var(--card);
  border-radius: 14px; overflow: hidden; transition: background .15s;
}
a.game:hover, a.game:active { background: var(--card-hover); }
a.game img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
.info { padding: 12px 14px 14px; }
.title { font-size: 18px; font-weight: 600; }
.tag { font-size: 12px; color: var(--accent); margin-left: 6px; font-weight: 500; }
.tag.paused { color: var(--muted); }
.desc { color: var(--muted); font-size: 14px; margin-top: 4px; line-height: 1.5; }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>游戏试玩</h1>
  <p class="lead">点一个开始玩。横屏体验更好；可以把某个游戏单独添加到主屏幕。</p>
  <div class="games">
    <a class="game" href="cubefps/">
      <img src="covers/cubefps.jpg" alt="重力立方截图">
      <div class="info">
        <div class="title">重力立方<span class="tag">试玩</span></div>
        <div class="desc">在正方体里面的第一人称射击，走到墙边就能走上墙。60 米的立方体，每一面都是一片霓虹街区，马路能一直走过棱边到下一面。机械兵和无人机一波一波来，箱子和路障能打碎。</div>
      </div>
    </a>
    <a class="game" href="badminton/">
      <img src="covers/badminton.jpg" alt="羽毛球截图">
      <div class="info">
        <div class="title">羽毛球<span class="tag">开发中</span></div>
        <div class="desc">手机单打羽毛球。左手摇杆移动，右手按键挥拍，打电脑 11 分一局。</div>
      </div>
    </a>
    <a class="game" href="lifesim/">
      <img src="covers/lifesim.jpg" alt="零零后截图">
      <div class="info">
        <div class="title">零零后<span class="tag paused">暂停</span></div>
        <div class="desc">一个 00 后的高中三年。试玩版：高一上学期。</div>
      </div>
    </a>
  </div>
  <footer>构建自 codlearner/indie-game，每个游戏在同名子路径下。</footer>
</main>
</body>
</html>
